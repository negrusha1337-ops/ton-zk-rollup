# Программа перехода состояния для zkVM (SP1) и её нативный запуск.
#   lib      — логика перехода состояния, без зависимостей от SP1
#   program  — гостевая программа SP1: читает вход, вызывает lib, коммитит публичные значения
#   native   — запуск той же логики на обычном процессоре: сценарий для тестов контракта
#   exit-lib, exit-program — аварийный выход: отдельная программа SP1 «у счёта есть баланс,
#              владелец согласен на вывод»; программу батчей она не затрагивает
[workspace]
members = ["lib", "program", "native", "exit-lib", "exit-program"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "alloc"] }

# Криптография через прекомпиляции SP1: внутри zkVM сжатие SHA-256, перестановку Keccak и
# арифметику secp256k1 считают системные вызовы, а не программный код. Вне zkVM крейты
# ведут себя как обычные. Теги должны соответствовать версии SP1.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.10.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-6.10.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", package = "k256", tag = "patch-k256-13.4-sp1-6.10.0" }
