# Хост спайка агрегации: сжатые пруфы блоков EVM (их строит rollup-evm-host --prove-compressed)
# → агрегатный пруф (сжатый и Groth16) с замером этапов. Тот же sp1-sdk, что у хоста EVM.
[package]
name = "spike-aggregate-host"
version.workspace = true
edition.workspace = true

[dependencies]
sp1-sdk = { version = "=6.10.0", features = ["bigint-rug", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.94"
clap = { version = "4.5.7", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
native-gnark = ["sp1-sdk/native-gnark"]
cuda = ["sp1-sdk/cuda"]
