# Копия крейта `rsp-mpt` из succinctlabs/rsp (crates/mpt, коммит 5afe72eb, MIT OR Apache-2.0)
# с двумя правками — см. VENDORED.md. Подключается вместо оригинала через [patch] в
# zkvm-evm/Cargo.toml и zkvm-evm/program/Cargo.toml.
[package]
name = "rsp-mpt"
description = ""
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rlp = "0.5.2"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0.61"

# reth
reth-primitives-traits = { version = "0.3.2", default-features = false }
reth-trie = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", default-features = false }

# alloy
alloy-primitives = { version = "1.5.6", default-features = false, features = ["map-foldhash"] }
alloy-rlp = "0.3.12"
alloy-rpc-types = { version = "2.0.4", default-features = false, features = ["eth"] }
alloy-rpc-types-debug = { version = "2.0.4", default-features = false, optional = true }

# arena mpt
bumpalo = { version = "3.19.0", features = ["collections"] }
smallvec = "1.13"
bytes = "1"

[dev-dependencies]
hex-literal = "0.4.1"
bincode = "1.3"

[features]
default = ["execution-witness"]
execution-witness = ["dep:alloy-rpc-types-debug"]
