# Гостевая программа SP1 для батча EVM. Отдельное рабочее пространство со своим Cargo.lock:
# от него зависит ELF, а с ним — ключ программы.
[package]
name = "rollup-evm-program"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
bincode = "1.3.3"
rollup-evm = { path = "../lib" }
sp1-zkvm = "=6.10.0"

# Журналирование зависимостей выключено на этапе компиляции — как в гостевой программе RSP.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", features = ["max_level_off", "release_max_level_off"] }

# Те же прекомпиляции, что в гостевой программе RSP.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.10.0", package = "sha2" }
substrate-bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.10.0-substrate-bn" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.10.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.10.0" }

# Дерево состояния — копия rsp-mpt с правками (vendor/rsp-mpt/VENDORED.md).
[patch."https://github.com/succinctlabs/rsp"]
rsp-mpt = { path = "../vendor/rsp-mpt" }
